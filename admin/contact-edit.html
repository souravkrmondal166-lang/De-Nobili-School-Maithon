<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Info | Admin - De Nobili School</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="admin.css">
</head>
<body>
    <div class="admin-layout">
        <aside class="admin-sidebar" id="sidebar"></aside>
        <main class="admin-main">
            <div class="admin-topbar"><h1>Contact Info</h1><a href="../index.html" target="_blank" class="view-site">View Public Site &rarr;</a><a href="#" onclick="AdminStore.logout();return false;" style="font-size:0.75rem;background:#fef2f2;color:#ef4444;padding:0.375rem 0.75rem;border-radius:9999px;text-decoration:none;font-weight:500;margin-left:0.5rem;transition:all 0.2s;" onmouseover="this.style.background='#fee2e2'" onmouseout="this.style.background='#fef2f2'"><i class="fas fa-sign-out-alt"></i> Logout</a></div>
            <div class="admin-content" style="max-width:640px;">
                <div class="a-info blue"><i class="fas fa-info-circle" style="margin-top:0.125rem;flex-shrink:0;"></i><div><p style="font-size:0.8rem;">Changes to contact information are reflected across all pages of the public website (header, footer, contact page).</p></div></div>

                <div class="a-card" style="margin-bottom:1.5rem;">
                    <div class="a-card-header"><h3>School Contact Details</h3></div>
                    <div class="a-card-body">
                        <div class="a-form-group"><label><i class="fas fa-envelope" style="color:#3b82f6;margin-right:0.25rem;"></i> Email Address</label><input type="email" class="a-input" id="f-email"></div>
                        <div class="a-form-group"><label><i class="fas fa-phone" style="color:#22c55e;margin-right:0.25rem;"></i> Phone Number</label><input type="tel" class="a-input" id="f-phone"></div>
                        <div class="a-form-group"><label><i class="fas fa-map-marker-alt" style="color:#ef4444;margin-right:0.25rem;"></i> Street Address</label><input type="text" class="a-input" id="f-address"></div>
                        <div class="a-form-row-3">
                            <div class="a-form-group"><label>City</label><input type="text" class="a-input" id="f-city"></div>
                            <div class="a-form-group"><label>State</label><input type="text" class="a-input" id="f-state"></div>
                            <div class="a-form-group"><label>PIN Code</label><input type="text" class="a-input" id="f-pincode"></div>
                        </div>
                    </div>
                </div>

                <div class="a-card" style="margin-bottom:1.5rem;">
                    <div class="a-card-header"><h3>External Links</h3></div>
                    <div class="a-card-body">
                        <div class="a-form-group"><label><i class="fas fa-link" style="color:#7c3aed;margin-right:0.25rem;"></i> Online Fee Payment URL</label><input type="url" class="a-input" id="f-fee" placeholder="https://www.parentsalarm.com/"></div>
                        <div class="a-form-group"><label><i class="fas fa-link" style="color:#0d9488;margin-right:0.25rem;"></i> Online Admission URL</label><input type="url" class="a-input" id="f-admission" placeholder="https://app.schoolcanvas.com/..."></div>
                    </div>
                </div>

                <div class="a-card" style="margin-bottom:1.5rem;">
                    <div class="a-card-header"><h3>Social Media</h3></div>
                    <div class="a-card-body">
                        <div class="a-form-group"><label><i class="fab fa-facebook" style="color:#1877f2;margin-right:0.25rem;"></i> Facebook URL</label><input type="url" class="a-input" id="f-facebook" placeholder="https://facebook.com/..."></div>
                        <div class="a-form-group"><label><i class="fab fa-instagram" style="color:#e4405f;margin-right:0.25rem;"></i> Instagram URL</label><input type="url" class="a-input" id="f-instagram" placeholder="https://instagram.com/..."></div>
                        <div class="a-form-group"><label><i class="fab fa-youtube" style="color:#ff0000;margin-right:0.25rem;"></i> YouTube URL</label><input type="url" class="a-input" id="f-youtube" placeholder="https://youtube.com/..."></div>
                        <div class="a-form-group"><label><i class="fab fa-x-twitter" style="color:#000;margin-right:0.25rem;"></i> X (Twitter) URL</label><input type="url" class="a-input" id="f-twitter" placeholder="https://x.com/..."></div>
                    </div>
                </div>

                <div style="display:flex;justify-content:flex-end;margin-bottom:1.5rem;">
                    <button class="a-btn a-btn-primary" id="save-btn" onclick="save()"><i class="fas fa-save"></i> Save Changes</button>
                </div>

                <div class="a-card">
                    <div class="a-card-header"><h3>Preview</h3></div>
                    <div class="a-card-body" id="preview" style="font-size:0.85rem;color:#475569;"></div>
                </div>
            </div>
        </main>
    </div>
    <script src="admin-store.js"></script>
    <script>
        AdminStore.checkAuth();
        document.getElementById('sidebar').innerHTML = renderAdminSidebar('contact');

        function load() {
            const c = AdminStore.getContact();
            document.getElementById('f-email').value = c.email || '';
            document.getElementById('f-phone').value = c.phone || '';
            document.getElementById('f-address').value = c.address || '';
            document.getElementById('f-city').value = c.city || '';
            document.getElementById('f-state').value = c.state || '';
            document.getElementById('f-pincode').value = c.pincode || '';
            document.getElementById('f-fee').value = c.feePaymentUrl || '';
            document.getElementById('f-admission').value = c.admissionUrl || '';
            document.getElementById('f-facebook').value = c.facebook || '';
            document.getElementById('f-instagram').value = c.instagram || '';
            document.getElementById('f-youtube').value = c.youtube || '';
            document.getElementById('f-twitter').value = c.twitter || '';
            updatePreview();
        }

        function save() {
            const c = {
                email: document.getElementById('f-email').value,
                phone: document.getElementById('f-phone').value,
                address: document.getElementById('f-address').value,
                city: document.getElementById('f-city').value,
                state: document.getElementById('f-state').value,
                pincode: document.getElementById('f-pincode').value,
                feePaymentUrl: document.getElementById('f-fee').value,
                admissionUrl: document.getElementById('f-admission').value,
                facebook: document.getElementById('f-facebook').value,
                instagram: document.getElementById('f-instagram').value,
                youtube: document.getElementById('f-youtube').value,
                twitter: document.getElementById('f-twitter').value
            };
            AdminStore.saveContact(c);
            updatePreview();
            const btn = document.getElementById('save-btn');
            btn.innerHTML = '<i class="fas fa-check"></i> Saved!';
            btn.style.background = '#16a34a';
            setTimeout(() => { btn.innerHTML = '<i class="fas fa-save"></i> Save Changes'; btn.style.background = ''; }, 2000);
            showToast('Contact info saved');
        }

        function updatePreview() {
            const e = id => document.getElementById(id).value;
            document.getElementById('preview').innerHTML =
                '<p style="font-size:0.75rem;color:#94a3b8;margin-bottom:0.75rem;">How contact info will appear on the website:</p>' +
                '<div style="display:flex;align-items:center;gap:0.5rem;margin-bottom:0.5rem;"><i class="fas fa-envelope" style="color:#94a3b8;width:16px;"></i> ' + e('f-email') + '</div>' +
                '<div style="display:flex;align-items:center;gap:0.5rem;margin-bottom:0.5rem;"><i class="fas fa-phone" style="color:#94a3b8;width:16px;"></i> ' + e('f-phone') + '</div>' +
                '<div style="display:flex;align-items:center;gap:0.5rem;"><i class="fas fa-map-marker-alt" style="color:#94a3b8;width:16px;"></i> ' + e('f-address') + ', ' + e('f-city') + ', ' + e('f-state') + ' - ' + e('f-pincode') + '</div>';
        }

        load();
    </script>
</body>
</html>
