<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faculty & Staff | Admin - De Nobili School</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="admin.css">
</head>
<body>
    <div class="admin-layout">
        <aside class="admin-sidebar" id="sidebar"></aside>
        <main class="admin-main">
            <div class="admin-topbar"><h1>Faculty & Staff</h1><a href="../index.html" target="_blank" class="view-site">View Public Site &rarr;</a><a href="#" onclick="AdminStore.logout();return false;" style="font-size:0.75rem;background:#fef2f2;color:#ef4444;padding:0.375rem 0.75rem;border-radius:9999px;text-decoration:none;font-weight:500;margin-left:0.5rem;transition:all 0.2s;" onmouseover="this.style.background='#fee2e2'" onmouseout="this.style.background='#fef2f2'"><i class="fas fa-sign-out-alt"></i> Logout</a></div>
            <div class="admin-content">
                <div style="display:flex;flex-wrap:wrap;gap:0.75rem;margin-bottom:1.25rem;">
                    <div class="a-input-icon" style="flex:1;min-width:200px;"><i class="fas fa-search"></i><input type="text" class="a-input" id="search" placeholder="Search by name or department..."></div>
                    <button class="a-btn a-btn-primary" onclick="openForm()"><i class="fas fa-user-plus"></i> Add Member</button>
                </div>
                <div class="a-tabs" id="tabs"></div>
                <div id="grid"></div>
            </div>
        </main>
    </div>
    <div class="admin-modal-backdrop" id="modal">
        <div class="admin-modal" style="max-width:540px;">
            <h3 id="modal-title">Add Member</h3>
            <form id="member-form">
                <div style="display:flex;align-items:center;gap:1rem;margin-bottom:1rem;">
                    <div id="photo-preview" style="width:64px;height:64px;border-radius:50%;background:#dbeafe;display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0;">
                        <i class="fas fa-user" style="font-size:1.5rem;color:#3b82f6;"></i>
                    </div>
                    <div>
                        <label style="font-size:0.8rem;font-weight:600;display:block;margin-bottom:0.25rem;">Profile Photo</label>
                        <input type="url" class="a-input" id="f-photo-url" placeholder="https://... (paste URL)" style="margin-bottom:0.375rem;font-size:0.8rem;">
                        <input type="file" accept="image/*" id="f-photo-file" style="font-size:0.75rem;">
                        <button type="button" id="remove-photo" style="display:none;font-size:0.7rem;color:#ef4444;background:none;border:none;cursor:pointer;margin-top:0.25rem;">Remove photo</button>
                    </div>
                </div>
                <input type="hidden" id="f-id">
                <input type="hidden" id="f-photo" value="">
                <div class="a-form-group"><label>Full Name *</label><input type="text" class="a-input" id="f-name" required placeholder="e.g. Mr. John Smith"></div>
                <div class="a-form-row">
                    <div class="a-form-group"><label>Role / Designation *</label><input type="text" class="a-input" id="f-role" required placeholder="e.g. Class Teacher"></div>
                    <div class="a-form-group"><label>Department / Subject</label><input type="text" class="a-input" id="f-dept" placeholder="e.g. Mathematics"></div>
                </div>
                <div class="a-form-row">
                    <div class="a-form-group"><label>Section</label>
                        <select class="a-input" id="f-section"><option>Administrative</option><option selected>Primary</option><option>Middle</option><option>Senior</option><option>Office</option></select>
                    </div>
                    <div class="a-form-group"><label>Qualification</label><input type="text" class="a-input" id="f-qual" placeholder="e.g. M.Sc, B.Ed"></div>
                </div>
                <div class="a-form-group"><label>Email</label><input type="email" class="a-input" id="f-email" placeholder="email@denobili.in"></div>
                <div class="a-form-row">
                    <div class="a-form-group"><label>Subject Taught</label><input type="text" class="a-input" id="f-subject" placeholder="e.g. English, Mathematics"></div>
                    <div class="a-form-group"><label>Class Teacher Of</label><input type="text" class="a-input" id="f-classteacher" placeholder="e.g. Class 10-A"></div>
                </div>
                <div class="a-form-group"><label>Description / Bio (for leadership roles)</label><textarea class="a-input" id="f-desc" rows="2" placeholder="e.g. Serving as Principal since 2018. Specializes in educational administration."></textarea></div>
                <div class="a-form-group">
                    <label style="display:flex;align-items:center;gap:0.5rem;cursor:pointer;">
                        <input type="checkbox" id="f-principal"> <i class="fas fa-star" style="color:#f59e0b;"></i> Principal / Vice-Principal (featured at top)
                    </label>
                </div>
                <div style="display:flex;gap:0.75rem;margin-top:1.25rem;">
                    <button type="button" class="a-btn a-btn-outline" style="flex:1;justify-content:center;" onclick="closeForm()">Cancel</button>
                    <button type="submit" class="a-btn a-btn-primary" style="flex:1;justify-content:center;"><i class="fas fa-save"></i> Save</button>
                </div>
            </form>
        </div>
    </div>
    <script src="admin-store.js"></script>
    <script>
        AdminStore.checkAuth();
        document.getElementById('sidebar').innerHTML = renderAdminSidebar('faculty');

        const SECTIONS = ['Administrative', 'Primary', 'Middle', 'Senior', 'Office'];
        let activeSection = 'All';
        let searchTerm = '';

        document.getElementById('search').addEventListener('input', e => { searchTerm = e.target.value.toLowerCase(); render(); });

        // Photo upload
        document.getElementById('f-photo-file').addEventListener('change', function() {
            fileToDataURL(this, url => {
                document.getElementById('f-photo').value = url;
                document.getElementById('photo-preview').innerHTML = '<img src="' + url + '" style="width:100%;height:100%;object-fit:cover;">';
                document.getElementById('remove-photo').style.display = 'block';
            });
        });
        document.getElementById('remove-photo').addEventListener('click', () => {
            document.getElementById('f-photo').value = '';
            document.getElementById('photo-preview').innerHTML = '<i class="fas fa-user" style="font-size:1.5rem;color:#3b82f6;"></i>';
            document.getElementById('remove-photo').style.display = 'none';
            document.getElementById('f-photo-file').value = '';
        });

        function openForm(id) {
            document.getElementById('modal').classList.add('active');
            if (id) {
                const m = AdminStore.getFaculty().find(f => f.id === id);
                if (!m) return;
                document.getElementById('modal-title').textContent = 'Edit Member';
                document.getElementById('f-id').value = m.id;
                document.getElementById('f-name').value = m.name;
                document.getElementById('f-role').value = m.role;
                document.getElementById('f-dept').value = m.department || '';
                document.getElementById('f-section').value = m.section || 'Primary';
                document.getElementById('f-qual').value = m.qualification || '';
                document.getElementById('f-email').value = m.email || '';
                document.getElementById('f-subject').value = m.subject || '';
                document.getElementById('f-classteacher').value = m.classTeacher || '';
                document.getElementById('f-desc').value = m.description || '';
                document.getElementById('f-principal').checked = m.isPrincipal || false;
                document.getElementById('f-photo').value = (m.photo && m.photo.startsWith('data:')) ? m.photo : '';
                document.getElementById('f-photo-url').value = (m.photo && !m.photo.startsWith('data:')) ? m.photo : '';
                if (m.photo) {
                    document.getElementById('photo-preview').innerHTML = '<img src="' + m.photo + '" style="width:100%;height:100%;object-fit:cover;">';
                    document.getElementById('remove-photo').style.display = 'block';
                }
            } else {
                document.getElementById('modal-title').textContent = 'Add Member';
                document.getElementById('member-form').reset();
                document.getElementById('f-id').value = '';
                document.getElementById('f-photo').value = '';
                document.getElementById('f-photo-url').value = '';
                document.getElementById('photo-preview').innerHTML = '<i class="fas fa-user" style="font-size:1.5rem;color:#3b82f6;"></i>';
                document.getElementById('remove-photo').style.display = 'none';
            }
        }

        function closeForm() { document.getElementById('modal').classList.remove('active'); }

        document.getElementById('member-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const data = AdminStore.getFaculty();
            const editId = document.getElementById('f-id').value;
            const member = {
                id: editId || AdminStore.genId(),
                name: document.getElementById('f-name').value,
                role: document.getElementById('f-role').value,
                department: document.getElementById('f-dept').value,
                section: document.getElementById('f-section').value,
                qualification: document.getElementById('f-qual').value,
                email: document.getElementById('f-email').value,
                subject: document.getElementById('f-subject').value,
                classTeacher: document.getElementById('f-classteacher').value,
                description: document.getElementById('f-desc').value,
                photo: document.getElementById('f-photo-url').value.trim() || document.getElementById('f-photo').value,
                isPrincipal: document.getElementById('f-principal').checked
            };
            if (editId) { const idx = data.findIndex(f => f.id === editId); if (idx !== -1) data[idx] = member; }
            else { data.push(member); }
            AdminStore.saveFaculty(data);
            closeForm(); render();
            showToast(editId ? 'Member updated' : 'Member added');
        });

        function deleteItem(id) {
            if (!confirm('Delete this member?')) return;
            AdminStore.saveFaculty(AdminStore.getFaculty().filter(f => f.id !== id));
            render(); showToast('Member deleted');
        }

        function setSection(s) { activeSection = s; render(); }

        function render() {
            const data = AdminStore.getFaculty();
            const counts = { All: data.length };
            SECTIONS.forEach(s => { counts[s] = data.filter(f => f.section === s).length; });

            document.getElementById('tabs').innerHTML = ['All', ...SECTIONS].map(s =>
                '<button class="a-tab' + (activeSection === s ? ' active' : '') + '" onclick="setSection(\'' + s + '\')">' + s + ' (' + (counts[s] || 0) + ')</button>'
            ).join('');

            let filtered = activeSection === 'All' ? data : data.filter(f => f.section === activeSection);
            if (searchTerm) filtered = filtered.filter(f => f.name.toLowerCase().includes(searchTerm) || (f.department || '').toLowerCase().includes(searchTerm));

            if (filtered.length === 0) {
                document.getElementById('grid').innerHTML = '<div class="a-empty"><i class="fas fa-user-graduate"></i><p>' + (searchTerm ? 'No members match your search.' : 'No members in this section.') + '</p></div>';
                return;
            }

            const sectionColors = { Administrative: 'a-badge-purple', Primary: 'a-badge-green', Middle: 'a-badge-blue', Senior: 'a-badge-red', Office: 'a-badge-gray' };

            // Separate principals from regular faculty
            const principals = filtered.filter(m => m.isPrincipal);
            const regular = filtered.filter(m => !m.isPrincipal);
            let html = '';

            // Featured Principal Cards
            if (principals.length > 0) {
                html += '<div class="a-card" style="margin-bottom:1.25rem;border:1px solid #fde68a;background:linear-gradient(135deg,#fffbeb,#fef3c7);"><div class="a-card-header" style="border-color:#fde68a;"><h3><i class="fas fa-star" style="color:#f59e0b;margin-right:0.5rem;"></i>School Leadership</h3></div><div class="a-card-body"><div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:1rem;">';
                html += principals.map(m =>
                    '<div style="display:flex;align-items:center;gap:1rem;padding:1rem;background:#fff;border-radius:0.75rem;border:1px solid #fde68a;box-shadow:0 2px 8px rgba(245,158,11,0.1);position:relative;">' +
                    '<div style="width:72px;height:72px;border-radius:50%;background:#dbeafe;display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0;border:3px solid #f59e0b;">' +
                    (m.photo ? '<img src="' + m.photo + '" style="width:100%;height:100%;object-fit:cover;">' : '<i class="fas fa-user" style="font-size:1.75rem;color:#3b82f6;"></i>') + '</div>' +
                    '<div style="flex:1;"><h4 style="font-size:1rem;font-weight:700;">' + m.name + '</h4><div style="color:#b45309;font-weight:600;font-size:0.85rem;">' + m.role + '</div>' +
                    (m.department ? '<div style="font-size:0.8rem;color:#64748b;">' + m.department + '</div>' : '') +
                    (m.qualification ? '<div style="font-size:0.75rem;color:#94a3b8;">' + m.qualification + '</div>' : '') +
                    (m.description ? '<div style="font-size:0.8rem;color:#64748b;margin-top:0.375rem;font-style:italic;line-height:1.4;border-top:1px solid #fde68a;padding-top:0.375rem;">' + m.description + '</div>' : '') +
                    (m.email ? '<div style="font-size:0.75rem;color:#3b82f6;margin-top:0.25rem;"><i class="fas fa-envelope" style="margin-right:0.25rem;"></i>' + m.email + '</div>' : '') + '</div>' +
                    '<div style="display:flex;flex-direction:column;gap:0.25rem;">' +
                    '<button class="a-btn-icon edit" onclick="openForm(\'' + m.id + '\')"><i class="fas fa-edit"></i></button>' +
                    '<button class="a-btn-icon delete" onclick="deleteItem(\'' + m.id + '\')"><i class="fas fa-trash"></i></button></div></div>'
                ).join('');
                html += '</div></div></div>';
            }

            // Regular faculty grid
            if (regular.length > 0) {
                html += '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:0.75rem;">';
                html += regular.map(m =>
                    '<div class="a-faculty-card">' +
                    '<div class="a-faculty-photo">' + (m.photo ? '<img src="' + m.photo + '" alt="' + m.name + '">' : '<i class="fas fa-user"></i>') + '</div>' +
                    '<div class="a-faculty-info"><h4>' + m.name + '</h4><div class="role">' + m.role + '</div><div class="dept">' + (m.department || '') + '</div>' +
                    (m.qualification ? '<div style="font-size:0.7rem;color:#94a3b8;margin-top:0.125rem;">' + m.qualification + '</div>' : '') +
                    '<span class="a-badge ' + (sectionColors[m.section] || 'a-badge-gray') + '" style="margin-top:0.375rem;">' + m.section + '</span></div>' +
                    '<div class="a-faculty-actions">' +
                    '<button class="a-btn-icon edit" onclick="openForm(\'' + m.id + '\')"><i class="fas fa-edit"></i></button>' +
                    '<button class="a-btn-icon delete" onclick="deleteItem(\'' + m.id + '\')"><i class="fas fa-trash"></i></button>' +
                    '</div></div>'
                ).join('') + '</div>';
            }

            document.getElementById('grid').innerHTML = html;
        }
        render();
    </script>
</body>
</html>
