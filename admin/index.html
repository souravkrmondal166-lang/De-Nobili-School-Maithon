<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | De Nobili School Maithon</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="admin.css">
</head>
<body>
    <div class="admin-login-page">
        <div class="admin-login-card">
            <div class="admin-login-header">
                <div class="logo-emblem">DN</div>
                <h1>De Nobili School</h1>
                <p>Admin Panel &mdash; Maithon</p>
            </div>
            <div class="admin-login-body">
                <h2>Administrator Sign In</h2>
                <p class="sub">Enter your credentials to access the admin panel</p>
                <div class="admin-login-error" id="login-error">
                    <i class="fas fa-exclamation-circle"></i> Invalid credentials. Please check your username, ID and password.
                </div>
                <form id="login-form">
                    <div class="a-form-group">
                        <label>Username</label>
                        <div class="a-input-icon"><i class="fas fa-user"></i>
                            <input type="text" class="a-input" id="username" placeholder="Enter username" required autocomplete="off">
                        </div>
                    </div>
                    <div class="a-form-group">
                        <label>ID Number</label>
                        <div class="a-input-icon"><i class="fas fa-id-card"></i>
                            <input type="text" class="a-input" id="idnumber" placeholder="Enter your ID number" required autocomplete="off">
                        </div>
                    </div>
                    <div class="a-form-group">
                        <label>Password</label>
                        <div class="a-input-icon" style="position:relative;">
                            <i class="fas fa-lock"></i>
                            <input type="password" class="a-input" id="password" placeholder="Enter password" required>
                            <button type="button" id="toggle-pass" style="position:absolute;right:0.75rem;top:50%;transform:translateY(-50%);background:none;border:none;color:#94a3b8;cursor:pointer;"><i class="fas fa-eye"></i></button>
                        </div>
                    </div>
                    <button type="submit" class="admin-login-btn" id="login-btn">
                        <i class="fas fa-sign-in-alt"></i> Sign In
                    </button>
                </form>
                <p style="text-align:center;margin-top:1.5rem;font-size:0.75rem;">
                    <a href="../index.html" style="color:#64748b;text-decoration:none;"><i class="fas fa-arrow-left"></i> Back to Website</a>
                </p>
            </div>
        </div>
    </div>
    <script src="admin-store.js"></script>
    <script>
        if (AdminStore.isLoggedIn()) window.location.href = 'dashboard.html';

        document.getElementById('toggle-pass').addEventListener('click', function() {
            const inp = document.getElementById('password');
            const icon = this.querySelector('i');
            if (inp.type === 'password') { inp.type = 'text'; icon.className = 'fas fa-eye-slash'; }
            else { inp.type = 'password'; icon.className = 'fas fa-eye'; }
        });

        document.getElementById('login-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const btn = document.getElementById('login-btn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Verifying...';

            setTimeout(() => {
                const user = document.getElementById('username').value;
                const id = document.getElementById('idnumber').value;
                const pass = document.getElementById('password').value;

                if (AdminStore.login(user, id, pass)) {
                    window.location.href = 'dashboard.html';
                } else {
                    document.getElementById('login-error').classList.add('show');
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Sign In';
                    setTimeout(() => document.getElementById('login-error').classList.remove('show'), 4000);
                }
            }, 800);
        });
    </script>
</body>
</html>
