<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leadership | Admin - De Nobili School</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="admin.css">
    <style>
        .leader-card{background:#fff;border:1px solid #e2e8f0;border-radius:1rem;padding:1.5rem;margin-bottom:1.5rem;transition:box-shadow 0.2s;}
        .leader-card:hover{box-shadow:0 4px 15px rgba(0,0,0,0.06);}
        .leader-card.inactive{opacity:0.5;}
        .leader-header{display:flex;align-items:center;gap:1rem;margin-bottom:1.25rem;padding-bottom:1rem;border-bottom:2px solid #eff6ff;}
        .leader-icon{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.1rem;color:#fff;}
        .leader-icon.principal{background:linear-gradient(135deg,#f59e0b,#d97706);}
        .leader-icon.vp{background:linear-gradient(135deg,#3b82f6,#2563eb);}
        .leader-icon.coordinator{background:linear-gradient(135deg,#22c55e,#16a34a);}
        .leader-toggle{margin-left:auto;}
        .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem;}
        .form-grid .full{grid-column:1/-1;}
        .preview-row{display:flex;gap:1rem;align-items:flex-start;margin-top:0.5rem;}
        .preview-img{width:80px;height:80px;border-radius:0.5rem;border:2px solid #e2e8f0;object-fit:cover;background:#f8fafc;}
        .sig-preview{height:50px;border-radius:0.375rem;border:1px solid #e2e8f0;background:#fff;}
    </style>
</head>
<body>
    <div class="admin-layout">
        <aside class="admin-sidebar" id="sidebar"></aside>
        <main class="admin-main">
            <div class="admin-topbar"><h1><i class="fas fa-crown" style="color:#f59e0b;margin-right:0.5rem;"></i>Leadership Management</h1><a href="../index.html" target="_blank" class="view-site">View Site &rarr;</a></div>
            <div class="admin-content">
                <div class="a-info blue"><i class="fas fa-info-circle" style="flex-shrink:0;"></i><div><p style="font-weight:600;font-size:0.85rem;">Administrative Members Page</p><p style="font-size:0.8rem;margin-top:0.125rem;">Manage the Principal, Vice Principal, and Coordinator shown on the Administrative Members page. Use photo URLs or upload files. Toggle VP/Coordinator on or off.</p></div></div>
                <div id="cards"></div>
                <button class="a-btn a-btn-primary" onclick="saveAll()" style="margin-top:1rem;"><i class="fas fa-save"></i> Save All Changes</button>
            </div>
        </main>
    </div>
    <script src="admin-store.js"></script>
    <script>
        AdminStore.checkAuth();
        document.getElementById('sidebar').innerHTML = renderAdminSidebar('leadership');

        var ROLES = [
            { key: 'principal', label: 'Principal', icon: 'principal', canToggle: false },
            { key: 'vp', label: 'Vice Principal', icon: 'vp', canToggle: true },
            { key: 'coordinator', label: 'Coordinator', icon: 'coordinator', canToggle: true }
        ];

        function render() {
            var data = AdminStore.getLeadership();
            var html = '';
            ROLES.forEach(function(r) {
                var d = data[r.key] || {};
                var active = r.canToggle ? (d.active || false) : true;
                html += '<div class="leader-card' + (active ? '' : ' inactive') + '">';
                html += '<div class="leader-header">';
                html += '<div class="leader-icon ' + r.icon + '"><i class="fas fa-crown"></i></div>';
                html += '<div><h3 style="font-size:1rem;font-weight:700;">' + r.label + '</h3>';
                html += '<span style="font-size:0.75rem;color:#64748b;">' + (d.name || 'Not configured') + '</span></div>';
                if (r.canToggle) {
                    html += '<label class="leader-toggle" style="display:flex;align-items:center;gap:0.5rem;cursor:pointer;font-size:0.8rem;color:#64748b;">';
                    html += '<input type="checkbox" id="active-' + r.key + '"' + (active ? ' checked' : '') + '> Show on page</label>';
                }
                html += '</div>';
                html += '<div class="form-grid">';
                html += '<div class="a-form-group"><label>Full Name *</label><input type="text" class="a-input" id="name-' + r.key + '" value="' + (d.name || '').replace(/"/g,'&quot;') + '" placeholder="e.g. Mrs. Shuckla Choudhary"></div>';
                html += '<div class="a-form-group"><label>Designation</label><input type="text" class="a-input" id="role-' + r.key + '" value="' + (d.role || r.label).replace(/"/g,'&quot;') + '" placeholder="' + r.label + '"></div>';
                html += '<div class="a-form-group full"><label>Description / Bio</label><textarea class="a-input" id="desc-' + r.key + '" rows="3" placeholder="Brief description of their role and qualifications...">' + (d.description || '') + '</textarea></div>';
                // Photo
                html += '<div class="a-form-group"><label>Photo (URL or upload)</label>';
                html += '<input type="url" class="a-input" id="photo-url-' + r.key + '" value="' + (d.photo && !d.photo.startsWith('data:') ? d.photo : '').replace(/"/g,'&quot;') + '" placeholder="https://... or upload below" style="margin-bottom:0.375rem;">';
                html += '<input type="file" accept="image/*" id="photo-file-' + r.key + '" onchange="previewFile(this,\'' + r.key + '\',\'photo\')" style="font-size:0.75rem;">';
                html += '<input type="hidden" id="photo-data-' + r.key + '" value="' + (d.photo && d.photo.startsWith('data:') ? d.photo : '').replace(/"/g,'&quot;') + '">';
                if (d.photo) html += '<div class="preview-row"><img src="' + d.photo + '" class="preview-img" id="photo-img-' + r.key + '"></div>';
                html += '</div>';
                // Signature
                html += '<div class="a-form-group"><label>Signature Image (optional)</label>';
                html += '<input type="url" class="a-input" id="sig-url-' + r.key + '" value="' + (d.signature && !d.signature.startsWith('data:') ? d.signature : '').replace(/"/g,'&quot;') + '" placeholder="https://... or upload below" style="margin-bottom:0.375rem;">';
                html += '<input type="file" accept="image/*" id="sig-file-' + r.key + '" onchange="previewFile(this,\'' + r.key + '\',\'sig\')" style="font-size:0.75rem;">';
                html += '<input type="hidden" id="sig-data-' + r.key + '" value="' + (d.signature && d.signature.startsWith('data:') ? d.signature : '').replace(/"/g,'&quot;') + '">';
                if (d.signature) html += '<div class="preview-row"><img src="' + d.signature + '" class="sig-preview" id="sig-img-' + r.key + '"></div>';
                html += '</div>';
                html += '</div></div>';
            });
            document.getElementById('cards').innerHTML = html;
        }
        render();

        function previewFile(input, key, type) {
            if (!input.files || !input.files[0]) return;
            var reader = new FileReader();
            reader.onload = function(e) {
                document.getElementById(type + '-data-' + key).value = e.target.result;
                document.getElementById(type + '-url-' + key).value = '';
            };
            reader.readAsDataURL(input.files[0]);
        }

        function saveAll() {
            var data = {};
            ROLES.forEach(function(r) {
                var photoUrl = document.getElementById('photo-url-' + r.key).value.trim();
                var photoData = document.getElementById('photo-data-' + r.key).value;
                var sigUrl = document.getElementById('sig-url-' + r.key).value.trim();
                var sigData = document.getElementById('sig-data-' + r.key).value;
                data[r.key] = {
                    name: document.getElementById('name-' + r.key).value.trim(),
                    role: document.getElementById('role-' + r.key).value.trim() || r.label,
                    description: document.getElementById('desc-' + r.key).value.trim(),
                    photo: photoUrl || photoData || '',
                    signature: sigUrl || sigData || '',
                    active: r.canToggle ? document.getElementById('active-' + r.key).checked : true
                };
            });
            AdminStore.saveLeadership(data);
            render();
            showToast('Leadership saved successfully!');
        }
    </script>
</body>
</html>
