<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Downloads | Admin - De Nobili School</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="admin.css">
    <style>
        .pdf-icon{width:44px;height:52px;background:linear-gradient(135deg,#ef4444,#dc2626);border-radius:0.375rem;display:flex;align-items:center;justify-content:center;color:#fff;font-size:1.1rem;flex-shrink:0;}
        .dl-item{display:flex;align-items:center;gap:1rem;padding:1rem 1.25rem;border-bottom:1px solid #f1f5f9;transition:background 0.15s;}
        .dl-item:hover{background:#f8fafc;}
        .dl-item:last-child{border-bottom:none;}
    </style>
</head>
<body>
    <div class="admin-layout">
        <aside class="admin-sidebar" id="sidebar"></aside>
        <main class="admin-main">
            <div class="admin-topbar"><h1>Downloads Manager</h1><a href="../index.html" target="_blank" class="view-site">View Public Site &rarr;</a><a href="#" onclick="AdminStore.logout();return false;" style="font-size:0.75rem;background:#fef2f2;color:#ef4444;padding:0.375rem 0.75rem;border-radius:9999px;text-decoration:none;font-weight:500;margin-left:0.5rem;"><i class="fas fa-sign-out-alt"></i> Logout</a></div>
            <div class="admin-content">
                <div class="a-info blue"><i class="fas fa-file-pdf" style="margin-top:0.125rem;flex-shrink:0;"></i><div><p style="font-weight:600;font-size:0.85rem;">Downloads Page</p><p style="font-size:0.8rem;margin-top:0.125rem;">Upload PDF documents here. They will appear on the public Downloads page for parents and students to access.</p></div></div>

                <div class="a-card" style="margin-bottom:1.5rem;">
                    <div class="a-card-header"><h3><i class="fas fa-upload" style="color:#3b82f6;margin-right:0.5rem;"></i>Upload New Document</h3></div>
                    <div class="a-card-body">
                        <div class="a-form-row">
                            <div class="a-form-group"><label>Document Title *</label><input type="text" class="a-input" id="f-title" placeholder="e.g. School Calendar 2026-27"></div>
                            <div class="a-form-group"><label>Category</label>
                                <select class="a-input" id="f-category"><option>General</option><option>Circulars</option><option>Syllabus</option><option>Timetable</option><option>Results</option><option>Forms</option><option>Notices</option></select>
                            </div>
                        </div>
                        <div class="a-form-group"><label>Description (optional)</label><input type="text" class="a-input" id="f-desc" placeholder="Brief description of the document"></div>
                        <div class="a-form-row">
                            <div class="a-form-group"><label>Upload PDF *</label><input type="file" id="f-file" accept=".pdf,application/pdf" style="font-size:0.8rem;"></div>
                            <div class="a-form-group"><label>Or paste URL</label><input type="url" class="a-input" id="f-url" placeholder="https://..."></div>
                        </div>
                        <input type="hidden" id="f-data" value="">
                        <input type="hidden" id="f-id" value="">
                        <div id="file-info" style="display:none;margin-bottom:1rem;">
                            <div style="display:flex;align-items:center;gap:0.5rem;padding:0.625rem;background:#f0fdf4;border:1px solid #bbf7d0;border-radius:0.5rem;">
                                <i class="fas fa-check-circle" style="color:#22c55e;"></i>
                                <span id="file-name" style="font-size:0.8rem;font-weight:500;color:#166534;"></span>
                                <span id="file-size" style="font-size:0.7rem;color:#94a3b8;margin-left:auto;"></span>
                            </div>
                        </div>
                        <button class="a-btn a-btn-primary" onclick="saveItem()"><i class="fas fa-upload"></i> <span id="save-label">Upload Document</span></button>
                    </div>
                </div>

                <!-- Filter tabs -->
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;flex-wrap:wrap;gap:0.75rem;">
                    <div class="a-tabs" id="filters" style="margin-bottom:0;"></div>
                    <span style="font-size:0.85rem;color:#64748b;" id="count"></span>
                </div>

                <div class="a-card"><div id="list"></div></div>
            </div>
        </main>
    </div>
    <script src="admin-store.js"></script>
    <script>
        AdminStore.checkAuth();
        document.getElementById('sidebar').innerHTML = renderAdminSidebar('downloads');
        let currentFilter = 'All';

        document.getElementById('f-file').addEventListener('change', function() {
            const file = this.files[0];
            if (!file) return;
            var sizeMB = file.size / (1024 * 1024);
            document.getElementById('file-name').textContent = file.name;
            document.getElementById('file-size').textContent = sizeMB.toFixed(2) + ' MB';
            document.getElementById('file-info').style.display = 'block';
            if (sizeMB > 4) {
                alert('⚠️ This PDF is ' + sizeMB.toFixed(1) + 'MB. Large files may fail to save in browser storage.\n\nRecommendation: Upload the PDF to Google Drive or your server, and paste the share link in the "Or paste URL" field.');
                this.value = '';
                document.getElementById('file-info').style.display = 'none';
                return;
            }
            const reader = new FileReader();
            reader.onload = e => { document.getElementById('f-data').value = e.target.result; document.getElementById('f-url').value = ''; };
            reader.readAsDataURL(file);
        });

        function saveItem() {
            const title = document.getElementById('f-title').value.trim();
            if (!title) { alert('Please enter a title'); return; }
            const fileData = document.getElementById('f-data').value;
            const fileUrl = document.getElementById('f-url').value.trim();
            const url = fileData || fileUrl;
            if (!url) { alert('Please upload a PDF or enter a URL'); return; }

            const data = AdminStore.getDownloads();
            const editId = document.getElementById('f-id').value;
            const item = {
                id: editId || AdminStore.genId(),
                title: title,
                category: document.getElementById('f-category').value,
                description: document.getElementById('f-desc').value,
                url: url,
                fileName: document.getElementById('file-name').textContent || '',
                date: new Date().toISOString().split('T')[0]
            };

            if (editId) {
                const idx = data.findIndex(x => x.id === editId);
                if (idx !== -1) data[idx] = item;
            } else {
                data.unshift(item);
            }

            AdminStore.saveDownloads(data);
            clearForm();
            render();
            showToast(editId ? 'Document updated' : 'Document uploaded');
        }

        function clearForm() {
            document.getElementById('f-title').value = '';
            document.getElementById('f-desc').value = '';
            document.getElementById('f-url').value = '';
            document.getElementById('f-data').value = '';
            document.getElementById('f-id').value = '';
            document.getElementById('f-file').value = '';
            document.getElementById('file-info').style.display = 'none';
            document.getElementById('save-label').textContent = 'Upload Document';
        }

        function editItem(id) {
            const item = AdminStore.getDownloads().find(x => x.id === id);
            if (!item) return;
            document.getElementById('f-id').value = item.id;
            document.getElementById('f-title').value = item.title;
            document.getElementById('f-category').value = item.category;
            document.getElementById('f-desc').value = item.description || '';
            if (item.url && !item.url.startsWith('data:')) document.getElementById('f-url').value = item.url;
            else document.getElementById('f-data').value = item.url;
            document.getElementById('save-label').textContent = 'Update Document';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function deleteItem(id) {
            if (!confirm('Delete this document?')) return;
            AdminStore.saveDownloads(AdminStore.getDownloads().filter(x => x.id !== id));
            render(); showToast('Document deleted');
        }

        function setFilter(cat) { currentFilter = cat; render(); }

        function render() {
            const data = AdminStore.getDownloads();
            const cats = ['All', ...new Set(data.map(d => d.category).filter(Boolean))];
            const filtered = currentFilter === 'All' ? data : data.filter(d => d.category === currentFilter);

            document.getElementById('count').textContent = filtered.length + ' document(s)';
            document.getElementById('filters').innerHTML = cats.map(c =>
                '<button class="a-tab' + (currentFilter === c ? ' active' : '') + '" onclick="setFilter(\'' + c + '\')">' + c + '</button>'
            ).join('');

            const list = document.getElementById('list');
            if (filtered.length === 0) {
                list.innerHTML = '<div class="a-empty"><i class="fas fa-file-pdf"></i><p>No documents yet. Upload one above.</p></div>';
                return;
            }

            list.innerHTML = filtered.map(d =>
                '<div class="dl-item">' +
                '<div class="pdf-icon"><i class="fas fa-file-pdf"></i></div>' +
                '<div style="flex:1;min-width:0;">' +
                '<h4 style="font-size:0.9rem;font-weight:600;">' + d.title + '</h4>' +
                (d.description ? '<p style="font-size:0.8rem;color:#64748b;margin-top:0.125rem;">' + d.description + '</p>' : '') +
                '<div style="display:flex;gap:0.75rem;margin-top:0.25rem;">' +
                '<span class="a-badge a-badge-blue">' + d.category + '</span>' +
                '<span style="font-size:0.7rem;color:#94a3b8;">' + (d.date || '') + '</span>' +
                (d.fileName ? '<span style="font-size:0.7rem;color:#94a3b8;">' + d.fileName + '</span>' : '') +
                '</div></div>' +
                '<div style="display:flex;gap:0.25rem;flex-shrink:0;">' +
                '<a href="' + d.url + '" target="_blank" class="a-btn-icon" title="Preview"><i class="fas fa-eye" style="color:#3b82f6;"></i></a>' +
                '<button class="a-btn-icon edit" onclick="editItem(\'' + d.id + '\')"><i class="fas fa-edit"></i></button>' +
                '<button class="a-btn-icon delete" onclick="deleteItem(\'' + d.id + '\')"><i class="fas fa-trash"></i></button>' +
                '</div></div>'
            ).join('');
        }
        render();
    </script>
</body>
</html>
