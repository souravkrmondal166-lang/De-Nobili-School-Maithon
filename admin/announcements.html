<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Announcements | Admin - De Nobili School</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="admin.css">
</head>
<body>
    <div class="admin-layout">
        <aside class="admin-sidebar" id="sidebar"></aside>
        <main class="admin-main">
            <div class="admin-topbar"><h1>Announcements</h1><a href="../index.html" target="_blank" class="view-site">View Site &rarr;</a></div>
            <div class="admin-content">
                <div class="a-info blue"><i class="fas fa-bullhorn" style="flex-shrink:0;"></i><div><p style="font-weight:600;font-size:0.85rem;">Announcements Manager</p><p style="font-size:0.8rem;margin-top:0.125rem;">Active announcements appear in the homepage ticker AND the public Announcements page under the School menu. You can optionally attach a photo to each announcement.</p></div></div>

                <div class="a-card" style="margin-bottom:1.5rem;">
                    <div class="a-card-header"><h3><i class="fas fa-plus-circle" style="color:#3b82f6;margin-right:0.5rem;"></i>Add New Announcement</h3></div>
                    <div class="a-card-body">
                        <div class="a-form-group"><label>Announcement Text *</label><textarea class="a-input" id="new-text" rows="2" placeholder="e.g. School will remain closed on 15th August..."></textarea></div>
                        <div class="a-form-row">
                            <div class="a-form-group"><label>Photo (optional) — URL or upload</label>
                                <input type="url" class="a-input" id="new-photo-url" placeholder="https://..." style="margin-bottom:0.375rem;">
                                <input type="file" accept="image/*" id="new-photo-file" style="font-size:0.75rem;">
                                <input type="hidden" id="new-photo-data" value="">
                            </div>
                            <div class="a-form-group" style="display:flex;flex-direction:column;justify-content:flex-end;">
                                <button class="a-btn a-btn-primary" onclick="addItem()" style="width:100%;"><i class="fas fa-plus"></i> Add Announcement</button>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="a-card">
                    <div class="a-card-header">
                        <h3>All Announcements (<span id="count">0</span>)</h3>
                        <div style="display:flex;gap:0.5rem;" id="badges"></div>
                    </div>
                    <div id="list"></div>
                </div>
            </div>
        </main>
    </div>
    <script src="admin-store.js"></script>
    <script>
        AdminStore.checkAuth();
        document.getElementById('sidebar').innerHTML = renderAdminSidebar('announcements');

        document.getElementById('new-photo-file').addEventListener('change', function() {
            if (!this.files[0]) return;
            var reader = new FileReader();
            reader.onload = function(e) {
                document.getElementById('new-photo-data').value = e.target.result;
                document.getElementById('new-photo-url').value = '';
            };
            reader.readAsDataURL(this.files[0]);
        });

        function addItem() {
            var text = document.getElementById('new-text').value.trim();
            if (!text) { alert('Enter announcement text'); return; }
            var photoUrl = document.getElementById('new-photo-url').value.trim();
            var photoData = document.getElementById('new-photo-data').value;
            var photo = photoUrl || photoData || '';

            var data = AdminStore.getAnnouncements();
            data.push({ id: AdminStore.genId(), text: text, photo: photo, active: true, createdAt: new Date().toISOString().split('T')[0] });
            AdminStore.saveAnnouncements(data);
            document.getElementById('new-text').value = '';
            document.getElementById('new-photo-url').value = '';
            document.getElementById('new-photo-data').value = '';
            document.getElementById('new-photo-file').value = '';
            render();
            showToast('Announcement added');
        }

        function toggleItem(id) {
            var data = AdminStore.getAnnouncements().map(function(a) { return a.id === id ? Object.assign({}, a, { active: !a.active }) : a; });
            AdminStore.saveAnnouncements(data); render();
        }

        function deleteItem(id) {
            if (!confirm('Delete this announcement?')) return;
            AdminStore.saveAnnouncements(AdminStore.getAnnouncements().filter(function(a) { return a.id !== id; }));
            render(); showToast('Deleted');
        }

        function render() {
            var data = AdminStore.getAnnouncements();
            var active = data.filter(function(a) { return a.active; }).length;
            document.getElementById('count').textContent = data.length;
            document.getElementById('badges').innerHTML = '<span class="a-badge a-badge-green">' + active + ' active</span><span class="a-badge a-badge-gray">' + (data.length - active) + ' hidden</span>';

            if (data.length === 0) {
                document.getElementById('list').innerHTML = '<div class="a-empty"><i class="fas fa-bullhorn"></i><p>No announcements yet.</p></div>';
                return;
            }
            document.getElementById('list').innerHTML = data.map(function(a) {
                return '<div style="display:flex;align-items:flex-start;gap:0.75rem;padding:1rem;border-bottom:1px solid #f1f5f9;">' +
                    (a.photo ? '<img src="' + a.photo + '" style="width:60px;height:60px;border-radius:0.375rem;object-fit:cover;flex-shrink:0;">' : '') +
                    '<div style="flex:1;min-width:0;"><p style="font-size:0.85rem;font-weight:500;color:#1e293b;">' + a.text + '</p>' +
                    '<div style="font-size:0.7rem;color:#94a3b8;margin-top:0.25rem;">' +
                    '<span class="a-badge ' + (a.active ? 'a-badge-green' : 'a-badge-gray') + '">' + (a.active ? 'Active' : 'Hidden') + '</span> &middot; ' + (a.createdAt || '') +
                    '</div></div>' +
                    '<div style="display:flex;gap:0.25rem;flex-shrink:0;">' +
                    '<button class="a-btn-icon" onclick="toggleItem(\'' + a.id + '\')"><i class="fas fa-' + (a.active ? 'eye-slash' : 'eye') + '"></i></button>' +
                    '<button class="a-btn-icon delete" onclick="deleteItem(\'' + a.id + '\')"><i class="fas fa-trash"></i></button>' +
                    '</div></div>';
            }).join('');
        }
        render();
    </script>
</body>
</html>
