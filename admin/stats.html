<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School Stats | Admin - De Nobili School</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="admin.css">
</head>
<body>
    <div class="admin-layout">
        <aside class="admin-sidebar" id="sidebar"></aside>
        <main class="admin-main">
            <div class="admin-topbar"><h1>School Stats</h1><a href="../index.html" target="_blank" class="view-site">View Public Site &rarr;</a><a href="#" onclick="AdminStore.logout();return false;" style="font-size:0.75rem;background:#fef2f2;color:#ef4444;padding:0.375rem 0.75rem;border-radius:9999px;text-decoration:none;font-weight:500;margin-left:0.5rem;transition:all 0.2s;" onmouseover="this.style.background='#fee2e2'" onmouseout="this.style.background='#fef2f2'"><i class="fas fa-sign-out-alt"></i> Logout</a></div>
            <div class="admin-content" style="max-width:600px;">
                <div class="a-info blue"><i class="fas fa-chart-bar" style="margin-top:0.125rem;flex-shrink:0;"></i><div><p style="font-size:0.8rem;">These statistics are displayed on the public website homepage in the hero counter section. Changes are reflected immediately.</p></div></div>
                <div class="a-card">
                    <div class="a-card-header"><h3>Edit Statistics</h3></div>
                    <div class="a-card-body">
                        <div class="a-form-row">
                            <div class="a-form-group">
                                <label><i class="fas fa-user-graduate" style="color:#3b82f6;margin-right:0.25rem;"></i> Total Students</label>
                                <input type="number" class="a-input" id="f-students" min="0">
                            </div>
                            <div class="a-form-group">
                                <label><i class="fas fa-chalkboard-teacher" style="color:#ea580c;margin-right:0.25rem;"></i> Faculty Members</label>
                                <input type="number" class="a-input" id="f-faculty" min="0">
                            </div>
                        </div>
                        <div class="a-form-row">
                            <div class="a-form-group">
                                <label><i class="fas fa-clock" style="color:#7c3aed;margin-right:0.25rem;"></i> Years Established</label>
                                <input type="number" class="a-input" id="f-years" min="0">
                            </div>
                            <div class="a-form-group">
                                <label><i class="fas fa-tree" style="color:#16a34a;margin-right:0.25rem;"></i> Campus Acres</label>
                                <input type="number" class="a-input" id="f-acres" min="0">
                            </div>
                        </div>
                        <button class="a-btn a-btn-primary" onclick="save()" style="margin-top:0.5rem;"><i class="fas fa-save"></i> Save Changes</button>
                    </div>
                </div>
                <div class="a-card" style="margin-top:1.5rem;">
                    <div class="a-card-header"><h3>Preview</h3></div>
                    <div class="a-card-body">
                        <p style="font-size:0.8rem;color:#64748b;margin-bottom:1rem;">How these stats will appear on the homepage:</p>
                        <div class="admin-stats-grid" id="preview" style="margin-bottom:0;"></div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="admin-store.js"></script>
    <script>
        AdminStore.checkAuth();
        document.getElementById('sidebar').innerHTML = renderAdminSidebar('stats');

        function load() {
            const s = AdminStore.getStats();
            document.getElementById('f-students').value = s.students;
            document.getElementById('f-faculty').value = s.faculty;
            document.getElementById('f-years').value = s.years;
            document.getElementById('f-acres').value = s.acres;
            renderPreview(s);
        }

        function save() {
            const s = {
                students: parseInt(document.getElementById('f-students').value) || 0,
                faculty: parseInt(document.getElementById('f-faculty').value) || 0,
                years: parseInt(document.getElementById('f-years').value) || 0,
                acres: parseInt(document.getElementById('f-acres').value) || 0
            };
            AdminStore.saveStats(s);
            renderPreview(s);
            showToast('Stats saved');
        }

        function renderPreview(s) {
            document.getElementById('preview').innerHTML =
                '<div class="a-stat"><div class="a-stat-icon blue"><i class="fas fa-user-graduate"></i></div><div><h3>' + s.students.toLocaleString() + '+</h3><p>Students</p></div></div>' +
                '<div class="a-stat"><div class="a-stat-icon orange"><i class="fas fa-chalkboard-teacher"></i></div><div><h3>' + s.faculty + '+</h3><p>Faculty</p></div></div>' +
                '<div class="a-stat"><div class="a-stat-icon purple"><i class="fas fa-clock"></i></div><div><h3>' + s.years + '+</h3><p>Years</p></div></div>' +
                '<div class="a-stat"><div class="a-stat-icon green"><i class="fas fa-tree"></i></div><div><h3>' + s.acres + '</h3><p>Acres</p></div></div>';
        }

        load();
    </script>
</body>
</html>
