<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Admin - De Nobili School</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="admin.css">
</head>
<body>
    <div class="admin-layout">
        <aside class="admin-sidebar" id="sidebar"></aside>
        <main class="admin-main">
            <div class="admin-topbar">
                <h1>Dashboard</h1>
                <a href="../index.html" target="_blank" class="view-site">View Public Site &rarr;</a><a href="#" onclick="AdminStore.logout();return false;" style="font-size:0.75rem;background:#fef2f2;color:#ef4444;padding:0.375rem 0.75rem;border-radius:9999px;text-decoration:none;font-weight:500;margin-left:0.5rem;transition:all 0.2s;" onmouseover="this.style.background='#fee2e2'" onmouseout="this.style.background='#fef2f2'"><i class="fas fa-sign-out-alt"></i> Logout</a>
            </div>
            <div class="admin-content" id="content"></div>
        </main>
    </div>
    <script src="admin-store.js"></script>
    <script>
        AdminStore.checkAuth();
        document.getElementById('sidebar').innerHTML = renderAdminSidebar('dashboard');

        function render() {
            const ann = AdminStore.getAnnouncements();
            const photos = AdminStore.getPhotos();
            const videos = AdminStore.getVideos();
            const faculty = AdminStore.getFaculty();
            const posts = AdminStore.getPosts();
            const stats = AdminStore.getStats();
            const governing = AdminStore.getGoverning();

            const activeAnn = ann.filter(a => a.active).length;
            const publishedPosts = posts.filter(p => p.published).length;
            const recentPosts = [...posts].sort((a,b) => (b.date||'').localeCompare(a.date||'')).slice(0,5);
            const recentPhotos = [...photos].slice(-4).reverse();

            document.getElementById('content').innerHTML = `
                <div class="a-welcome">
                    <h2>Welcome to Admin Panel</h2>
                    <p>De Nobili School, Maithon &mdash; Manage your school website from here</p>
                    <div class="a-welcome-stats">
                        <div class="a-welcome-stat"><span>Students: </span><strong>${stats.students.toLocaleString()}+</strong></div>
                        <div class="a-welcome-stat"><span>Faculty: </span><strong>${stats.faculty}+</strong></div>
                        <div class="a-welcome-stat"><span>Years: </span><strong>${stats.years}+</strong></div>
                        <div class="a-welcome-stat"><span>Campus: </span><strong>${stats.acres} Acres</strong></div>
                    </div>
                </div>

                <div class="admin-stats-grid">
                    <a href="announcements.html" class="a-stat" style="text-decoration:none;">
                        <div class="a-stat-icon blue"><i class="fas fa-bullhorn"></i></div>
                        <div><h3>${activeAnn}</h3><p>Announcements</p>${ann.length - activeAnn > 0 ? '<span style="font-size:0.7rem;color:#94a3b8;">' + (ann.length - activeAnn) + ' hidden</span>' : ''}</div>
                    </a>
                    <a href="photos.html" class="a-stat" style="text-decoration:none;">
                        <div class="a-stat-icon green"><i class="fas fa-images"></i></div>
                        <div><h3>${photos.length}</h3><p>Photos</p></div>
                    </a>
                    <a href="videos.html" class="a-stat" style="text-decoration:none;">
                        <div class="a-stat-icon purple"><i class="fas fa-video"></i></div>
                        <div><h3>${videos.length}</h3><p>Videos</p></div>
                    </a>
                    <a href="faculty.html" class="a-stat" style="text-decoration:none;">
                        <div class="a-stat-icon orange"><i class="fas fa-user-graduate"></i></div>
                        <div><h3>${faculty.length}</h3><p>Faculty</p></div>
                    </a>
                    <a href="governing.html" class="a-stat" style="text-decoration:none;">
                        <div class="a-stat-icon teal"><i class="fas fa-users"></i></div>
                        <div><h3>${governing.length}</h3><p>Governing Body</p></div>
                    </a>
                    <a href="posts.html" class="a-stat" style="text-decoration:none;">
                        <div class="a-stat-icon red"><i class="fas fa-newspaper"></i></div>
                        <div><h3>${publishedPosts}</h3><p>Published Posts</p>${posts.length - publishedPosts > 0 ? '<span style="font-size:0.7rem;color:#94a3b8;">' + (posts.length - publishedPosts) + ' drafts</span>' : ''}</div>
                    </a>
                </div>

                <div class="a-card" style="margin-bottom:1.5rem;">
                    <div class="a-card-header"><h3>Quick Actions</h3></div>
                    <div class="a-card-body">
                        <div class="a-quick-actions">
                            <a href="announcements.html" class="a-quick-action" style="background:#eff6ff;color:#2563eb;"><i class="fas fa-bullhorn"></i><span>Add Announcement</span></a>
                            <a href="photos.html" class="a-quick-action" style="background:#f0fdf4;color:#16a34a;"><i class="fas fa-camera"></i><span>Upload Photo</span></a>
                            <a href="videos.html" class="a-quick-action" style="background:#faf5ff;color:#7c3aed;"><i class="fas fa-video"></i><span>Add Video</span></a>
                            <a href="faculty.html" class="a-quick-action" style="background:#fff7ed;color:#ea580c;"><i class="fas fa-user-plus"></i><span>Add Faculty</span></a>
                            <a href="posts.html" class="a-quick-action" style="background:#fef2f2;color:#dc2626;"><i class="fas fa-pen"></i><span>Write Post</span></a>
                            <a href="contact-edit.html" class="a-quick-action" style="background:#f0fdfa;color:#0d9488;"><i class="fas fa-phone"></i><span>Edit Contact</span></a>
                        </div>
                    </div>
                </div>

                <div class="a-grid-2">
                    <div class="a-card">
                        <div class="a-card-header"><h3>Recent Posts</h3><a href="posts.html" style="font-size:0.75rem;color:#3b82f6;text-decoration:none;">View all</a></div>
                        <div class="a-card-body" style="padding:0;">
                            ${recentPosts.length === 0 ? '<div class="a-empty" style="padding:2rem;"><p>No posts yet.</p></div>' :
                            recentPosts.map(p => '<div style="display:flex;align-items:flex-start;gap:0.75rem;padding:0.75rem 1.25rem;border-bottom:1px solid #f1f5f9;"><i class="fas ' + (p.published ? 'fa-check-circle" style="color:#22c55e;margin-top:0.25rem;"' : 'fa-clock" style="color:#f59e0b;margin-top:0.25rem;"') + '></i><div><div style="font-size:0.85rem;font-weight:500;">' + p.title + '</div><div style="font-size:0.7rem;color:#94a3b8;">' + (p.date || '') + ' &middot; ' + (p.category || '') + '</div></div></div>').join('')}
                        </div>
                    </div>
                    <div class="a-card">
                        <div class="a-card-header"><h3>Recent Photos</h3><a href="photos.html" style="font-size:0.75rem;color:#3b82f6;text-decoration:none;">Manage</a></div>
                        <div class="a-card-body">
                            ${recentPhotos.length === 0 ? '<div class="a-empty"><p>No photos yet.</p></div>' :
                            '<div style="display:grid;grid-template-columns:1fr 1fr;gap:0.5rem;">' + recentPhotos.map(p => '<div style="aspect-ratio:16/9;border-radius:0.5rem;overflow:hidden;position:relative;background:#e2e8f0;"><img src="' + p.url + '" style="width:100%;height:100%;object-fit:cover;" onerror="this.style.display=\'none\'"><div style="position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,rgba(0,0,0,0.6));padding:0.375rem;"><span style="color:#fff;font-size:0.65rem;font-weight:500;">' + p.title + '</span></div></div>').join('') + '</div>'}
                        </div>
                    </div>
                </div>

                <div class="a-card" style="margin-top:1rem;">
                    <div class="a-card-header"><h3>Active Announcements</h3><a href="announcements.html" style="font-size:0.75rem;color:#3b82f6;text-decoration:none;">Manage all</a></div>
                    <div class="a-card-body" style="padding:0.5rem 1.25rem;">
                        ${ann.filter(a => a.active).length === 0 ? '<p style="color:#94a3b8;font-size:0.85rem;padding:1rem 0;">No active announcements.</p>' :
                        ann.filter(a => a.active).slice(0,4).map(a => '<div style="display:flex;align-items:center;gap:0.75rem;padding:0.625rem;background:#eff6ff;border-radius:0.5rem;margin-bottom:0.5rem;"><i class="fas fa-eye" style="color:#3b82f6;"></i><span style="flex:1;font-size:0.85rem;color:#374151;">' + a.text + '</span><span class="a-badge a-badge-green">Live</span></div>').join('')}
                    </div>
                </div>
            `;
        }
        render();
    </script>
</body>
</html>
